<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secret Santa</title>
<style>
body{font-family:system-ui;background:#103b2b;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}
.card{background:#fff;color:#17352b;padding:28px;border-radius:20px;width:min(90%,420px);box-shadow:0 18px 50px #0005}
h1{text-align:center;color:#b21f2d}
select,input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #ccc;font-size:16px}
button{background:#b21f2d;color:white;border:0;font-weight:700;cursor:pointer}
.result{text-align:center;font-size:22px;font-weight:700;margin-top:20px;min-height:32px}
.small{font-size:13px;color:#667;text-align:center}
</style>
</head>
<body>
<main class="card">
<h1>🎅 Secret Santa 🎁</h1>
<p>Choisis ton prénom et saisis ton code secret.</p>
<select id="name">
<option value="">Ton prénom…</option>
<option>Adrien</option>
<option>Antoine</option>
<option>Etienne</option>
<option>Nathan</option>
<option>Pierre</option>
<option>Raphael</option>
<option>Sarah</option>
<option>Youenn</option>
</select>
<input id="code" autocomplete="off" placeholder="Code secret">
<button onclick="reveal()">Découvrir mon tirage</button>
<div id="result" class="result"></div>
<p class="small">Un seul tirage par personne. Garde ton résultat secret 🤫</p>
</main>
<script>
const D={"Adrien": {"code": "LW9C363S", "to": "Sarah"}, "Antoine": {"code": "DMGM9BXG", "to": "Nathan"}, "Etienne": {"code": "6YZGG9B8", "to": "Adrien"}, "Nathan": {"code": "NMSK5CDP", "to": "Youenn"}, "Pierre": {"code": "GNZCLGCL", "to": "Etienne"}, "Raphael": {"code": "ZU3TTBTC", "to": "Antoine"}, "Sarah": {"code": "ECST537B", "to": "Pierre"}, "Youenn": {"code": "XG4VUPKD", "to": "Raphael"}};
function reveal(){
const n=document.getElementById('name').value,c=document.getElementById('code').value.trim().toUpperCase(),r=document.getElementById('result');
if(!n||!c){r.textContent='Choisis ton prénom et entre ton code.';return}
if(D[n]&&D[n].code===c){r.textContent='🎁 Tu offres à : '+D[n].to}else{r.textContent='❌ Prénom ou code incorrect.'}
}
</script>
</body>
</html>
